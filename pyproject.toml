[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextdong-yapi-mcp"
version = "0.1.0"
description = "MCP server: fetch YApi JSON API docs so agents can integrate client projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ContextDong" }]
keywords = ["mcp", "yapi", "api", "agent", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ContextDong/Yapi-Mcp"
Repository = "https://github.com/ContextDong/Yapi-Mcp"
Issues = "https://github.com/ContextDong/Yapi-Mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yapi-mcp = "yapi_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
